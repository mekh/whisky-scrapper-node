# The API's load balancer, in front of the N app replicas.
#
# It exists because the API's ceiling is one JavaScript thread (see
# docs/LOAD-TEST-2026-09.md) and the remedy is several instances. It publishes
# exactly the address the host nginx already proxies to, so nginx is not
# touched when the instance count changes: `APP_INSTANCES` in the host `.env`
# is the only number, and `server-template` below picks the replicas up from
# Docker's own DNS.
#
# Mounted read-only by docker-compose.yaml, beside which it lives.

global
  # To the container log, where compose already collects everything else.
  log stdout format raw local0 info
  maxconn 4096

defaults
  mode http
  log global
  option httplog
  # Only failures are logged. The host nginx already writes an access log of
  # the same requests, and a second copy of each buys nothing but disk.
  option dontlog-normal
  # Longer than the app's own request deadline (APP_REQUEST_DEADLINE_MS,
  # 45 s), so an overrunning request is answered by the app's 503 rather than
  # by a 504 from here, which would say nothing about what stalled.
  timeout server 60s
  timeout connect 5s
  timeout client 65s
  timeout http-request 15s
  timeout http-keep-alive 10s
  retries 2
  # Retry on ANOTHER replica, not the one that just refused: without this a
  # connection to a replica that has gone away is retried against that same
  # replica and then answered 503. It covers a refused connection only — a
  # response already under way when its replica dies cannot be retried by any
  # proxy, which is what the app's graceful shutdown and `stop_grace_period`
  # are for.
  option redispatch

# Docker's embedded DNS. It answers the compose service name — `be`, which is
# also what the replicas are named after (`whisky-be-1..N`) — with one A record
# per replica, and that is what `server-template` turns into servers: scaling
# up or down needs no change here, only a re-resolution.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold other 5s
  hold refused 5s
  hold nx 5s
  hold timeout 5s

frontend public
  bind :4000
  # NOTHING here may touch X-Real-IP or X-Forwarded-For, and `option
  # forwardfor` must never be added: the host nginx sets both from the real
  # client, and this proxy's own view of "the client" is nginx. Appending it
  # would put nginx's address at the tail of X-Forwarded-For, which is the hop
  # the API reads — collapsing every caller into one rate-limit bucket and one
  # login ladder. Passing them through untouched is the whole contract.
  default_backend app

backend app
  # Least connections rather than round robin: a request here is a cached
  # report page or a cold one, and their costs differ by an order of
  # magnitude, so spreading by outstanding work beats spreading by count.
  balance leastconn

  # A liveness probe that names no dependency: it answers from the process
  # alone, so a wobbling Postgres or Valkey cannot take every replica out of
  # rotation at once, and a replica whose event loop is blocked fails it by
  # not answering — which is the one thing this check is for.
  option httpchk
  http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
  http-check expect status 200

  # Sixteen slots for a host with eight cores: a slot with no DNS answer costs
  # a few bytes and is never checked (`init-addr none`), so the ceiling is set
  # far past any instance count worth running. Raising APP_INSTANCES past this
  # is the one case that needs this file edited.
  server-template be 16 be:4000 check inter 5s fall 3 rise 2 resolvers docker init-addr none

# Operator and monitoring surface, on the compose network only — nothing is
# published to the host. `/stats` is the live table (which replicas are up,
# sessions, queue, errors); `/metrics` is the native Prometheus exporter, so
# the monitoring stack needs no side-car when it arrives.
listen monitoring
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 10s
  http-request use-service prometheus-exporter if { path /metrics }
