# Template server block for the HOST nginx (neither repository's image bundles
# nginx). Drop it into the host's nginx — e.g. /etc/nginx/conf.d/whisky-web.conf
# or sites-available/ — and adjust `root`, `server_name`, and `proxy_pass`.
# This is the config for deploy Option 1 (serve the built dist/ directly). For
# Option 2 (a Docker container behind this nginx) see ../../../web/README.md.
#
# It serves the built `dist/` and reverse-proxies the API under the SAME origin,
# so the auth refresh cookie (HttpOnly; Secure; SameSite=strict) works without
# CORS. Terminate TLS here (or at an upstream LB) — the cookie is Secure, so the
# app must be served over HTTPS in production.
#
# WHY IT LIVES IN THE BACKEND REPOSITORY (moved from ../web/scripts/ on
# 2026-09-15): this file describes the deployment's topology, and the topology
# already lives here — the compose project, the private-interface addresses,
# the replica count, HAProxy, Prometheus and Grafana are all under `be/` and
# `be/infra/`. Splitting the edge across two repositories meant the two halves
# of one decision (what HAProxy balances, what nginx exposes) were reviewed
# separately. The cost, stated plainly: roughly half of this file is about
# serving the SPA, so a frontend-only edge change now lands in the backend
# repository. `../web/README.md` points here for both deploy options.
server {
  listen 80;
  server_name _;

  # Where you copied the built dist/ (see README, deploy Option 1).
  root /var/www/whisky-web;
  index index.html;

  # Security headers. `always` makes them apply to error responses too, and
  # since no location below declares its own `add_header` they are inherited
  # everywhere -- including `location /api/`, which is why @fastify/helmet
  # leaves these five to us (it would append a second, conflicting copy).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # Served over HTTPS in production; the cookie is Secure, so force HTTPS.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Swagger UI + OpenAPI spec must NOT be public. They are mounted on the API
  # (/api/docs and /api/docs-json) OUTSIDE the app's auth guards, so block them
  # at the edge as defense-in-depth (the backend also gates them behind
  # SWAGGER_ENABLED). A regex location is matched before the /api/ prefix below.
  # To instead expose them behind a password, swap `return 404;` for an
  # auth_basic + proxy_pass block.
  location ~ ^/api/docs(-json|-yaml)?(/|$) {
    return 404;
  }

  # Liveness, and the ONE health route that stays public. It answers a
  # constant from the process alone and discloses nothing — no dependency
  # name, no latency, no version — so an external uptime monitor can watch
  # the site with no credential. This is an exact-match location, which in
  # nginx outranks every regex, so it wins over the block below regardless of
  # order. HAProxy probes the same route from inside the compose network and
  # never passes through here.
  location = /api/health/live {
    proxy_pass http://127.0.0.1:4000/health/live;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The monitoring surface must NOT be public.
  #
  #   /api/metrics          the Prometheus exposition — every route pattern,
  #                         every store slug, the replica's heap and event
  #                         loop, how much the scrapers cost. It is unguarded
  #                         by design (a scraper holds no token) and Prometheus
  #                         reaches the replicas directly on the compose
  #                         network, so nothing legitimate needs it here.
  #   /api/health           the deep check — names Postgres and both Valkeys
  #                         and reports their latency.
  #   /api/health/ready     the same checks in a terser form.
  #
  # `404` rather than `403`, following the /api/docs block above: it says
  # nothing is there, instead of confirming that something is and refusing
  # it. `/api/health/live` is exempt via the exact-match location above.
  location ~ ^/api/(metrics|health)(/|$) {
    return 404;
  }

  # Rate-limit the auth endpoints against online password brute-force /
  # credential stuffing. These exact-match locations win over the /api/ prefix
  # below and draw on a shared zone that MUST be declared in the http{}
  # context (in nginx.conf, not here):
  #
  #   limit_req_zone $binary_remote_addr zone=whisky_auth:10m rate=10r/m;
  #   limit_req_status 429;
  #
  # rate/burst are tunable: 10r/m + burst=8 lets a human retry a few times,
  # then throttles to ~1 request per 6s per client IP.
  #
  # The app has its own per-caller limiter as well (3 r/s with a burst of 10,
  # stricter on some routes), but these two locations are the only ones it
  # cannot key by account: they are its sole public endpoints, so it falls
  # back to an address. It reads that address from the X-Real-IP set below —
  # the `$remote_addr` form, which REPLACES whatever the client sent — and
  # otherwise from the LAST hop of X-Forwarded-For, since
  # $proxy_add_x_forwarded_for APPENDS and the head of that chain is
  # therefore whatever the client chose. Two consequences for anyone editing
  # this file: keep X-Real-IP on the `$remote_addr` form, and do not switch
  # X-Forwarded-For to a form that drops the real peer from the tail.
  #
  # This zone stays regardless: it is stricter than the app's limiter and it
  # refuses before a request reaches Node at all.
  location = /api/auth/login {
    limit_req zone=whisky_auth burst=8 nodelay;

    proxy_pass http://127.0.0.1:4000/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/refresh {
    limit_req zone=whisky_auth burst=8 nodelay;

    proxy_pass http://127.0.0.1:4000/auth/refresh;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API — same-origin proxy to the Node backend. The trailing slash on
  # proxy_pass strips the /api prefix (the backend serves /auth, /report, ...).
  location /api/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker must never be served stale. `expires epoch` emits
  # Cache-Control: no-cache without an add_header of its own, so the security
  # headers above stay inherited here (a location-level add_header would
  # replace them). Registration already uses updateViaCache: 'none'; this is
  # belt-and-braces.
  location = /sw.js {
    expires epoch;
    try_files $uri =404;
  }

  # Older mime.types files predate .webmanifest; name the type explicitly.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
  }

  # Hashed build assets are content-addressed — cache them forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — every other path serves the app shell.
  location / {
    try_files $uri /index.html;
  }
}
