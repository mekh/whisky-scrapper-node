# The compose project name, declared rather than inherited from the directory.
# It is half of what every container is called — compose builds a replica's
# name as `<project>-<service>-<number>` — so with the service below named
# `be`, the replicas read `whisky-be-1..N` beside the `whisky-*` containers
# that carry a fixed `container_name`. Stating it here also makes the name
# independent of where the command is run from, which a `COMPOSE_PROJECT_NAME`
# in the environment would not be.
#
# Changing it again is not a rolling change: a container cannot move between
# projects while the old one holds its name, so it costs a `docker compose
# down` (never `-v` — the data volumes are external) and a fresh `up`.
name: whisky

# Where every service's `logging:` points. The `json-file` driver ran with no
# rotation at all until 2026-09-16, on the disk that also carries `pg_data`,
# the session Valkey's AOF, the bind-mounted `./log` and the Prometheus TSDB —
# an unbounded growth path whose only guard was the 85 %-full alert.
#
# These files are no longer the archive. Vector ships every line to
# VictoriaLogs, which keeps thirty days of it under two ceilings of its own
# (see docs/LOGS-PLAN.md), so what is left here is the buffer `docker compose
# logs` reads. It is therefore sized for "recent enough to be useful" rather
# than for retention: 60 MB per container, and `be` is three of them.
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  db:
    container_name: whisky-db
    image: postgres:18
    # Tuning, measured on 2026-09-13 rather than taken from a calculator; the
    # evidence is in `docs/POSTGRES-TUNING.md`. The short version is that this
    # database is ~150 MB and fully resident — the load test read 99.997 % of
    # its blocks from cache and zero from disk — so the usual I/O knobs buy
    # nothing here and only one of these values was worth anything.
    #
    # `jit=off` is that one: PostgreSQL compiled 83 functions on every run of
    # the catalogue query, which costs more than it saves on a query that
    # finishes in a fifth of a second with no I/O at all (312 -> 213 ms,
    # three runs each way). It does NOT raise the API's ceiling, because at
    # the load where the response-time limits break the database is idle and
    # the queue is in the Node process; it makes each uncached query cheaper,
    # which is worth having anyway.
    #
    # `max_connections` is deliberately NOT raised and so is not listed, and
    # the 2026-09-13 ladders turned that from a precaution into a measurement:
    # the pool feeding it (`DB_POOL_SIZE_TOTAL`, shared across every instance)
    # was cut from 50 to 24 and the database did MORE work, ~360 commits/s
    # against ~340, because 48 backends is six times this host's core count
    # and the host also runs three Node replicas, two Valkeys and HAProxy.
    # Raising either number is the wrong direction; see
    # `docs/LOAD-TEST-2026-09.md`.
    #
    # `max_parallel_workers_per_gather` is left at its default for the same
    # discipline: no query measured here launches a worker at all.
    command:
      - postgres
      - -c
      - jit=off
      # Six times the whole database. Not the conventional 25 % of RAM (4 GB),
      # which would take memory from the API container and the cache for a
      # database that does not need it.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      # A planner hint about what the OS will have cached, not an allocation.
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-8GB}
      # Per sort/hash NODE, not per query, so it multiplies by the pool. 16 MB
      # clears the small spills; the dashboard's 60 MB percentile sort still
      # goes to disk on purpose, because the global value that would hold it
      # risks gigabytes across the whole pool for no measured latency gain.
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      # VACUUM, index builds and migrations only — never the serving path.
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      # Correct for SSD, where the default of 4 describes a spinning disk.
      # Honest caveat: it changed no plan measured here, because every table
      # this query touches is small enough to be scanned outright.
      - -c
      - random_page_cost=1.1
      # Not tuning but attribution: the multi-instance ladder of 2026-09-13
      # left the database as the constraint and nothing could say which
      # statements its time went to, so every claim about that was an
      # inference. The extension itself is installed by migration; this is
      # the half that makes it collect. It costs a small per-statement
      # bookkeeping overhead on the serving path, which is the honest price
      # of being able to answer the question at all.
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      - POSTGRES_DB=${DB_NAME:?DB_NAME is required}
      - POSTGRES_USER=${DB_USER:?DB_USER is required}
      - POSTGRES_PASSWORD=${DB_PASS:?DB_PASS is required}
    volumes:
      # PG18 keeps its cluster in a versioned subdirectory, so the mount is the
      # parent and not `/var/lib/postgresql/data`. Mounting the child against
      # an existing volume gives an empty cluster.
      - pg_data:/var/lib/postgresql
    # Published because `scripts/db-backup.sh` reaches the database over TCP
    # (`pg_dump -h $DB_HOST -p $DB_PORT`) rather than through `docker exec`.
    # The left-hand side is a host address: naming one publishes on that
    # interface alone, where omitting it would bind every interface the host
    # has.
    ports:
      - '${PG_BIND_IP:-192.168.179.2}:${PG_BIND_PORT:-5431}:5432'
    networks:
      - whisky-db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 10
    stop_grace_period: 60s
    logging: *logging
    restart: unless-stopped

  valkey:
    container_name: whisky-valkey
    image: valkey/valkey:8
    # The session store: auth sessions and the login throttle. It keeps its
    # data — a lost session key is read as a revoked session and signs that
    # user out of every device — and it is deliberately given no eviction
    # policy, which is the whole reason the catalogue cache is a second
    # instance further down.
    command: valkey-server --save 60 1 --appendonly yes
    volumes:
      - valkey_data:/data
    ports:
      - '${VALKEY_BIND_IP:-192.168.179.2}:${VALKEY_BIND_PORT:-6378}:6379'
    networks:
      - whisky-valkey
    healthcheck:
      test: valkey-cli ping
      start_period: 1s
      interval: 10s
      timeout: 2s
      retries: 3
    stop_grace_period: 30s
    logging: *logging
    restart: unless-stopped

  migrate:
    container_name: whisky-be-migrate
    # Reuses the image built by `service`; there is no registry, so a missing
    # local image must fail loudly instead of triggering a pull.
    image: whisky-be
    pull_policy: never
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      - DB_HOST=whisky-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASS=${DB_PASS:?DB_PASS is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - whisky-db
    logging: *logging
    restart: 'no'

  cache:
    container_name: whisky-cache
    image: valkey/valkey:8
    # The catalogue cache, and deliberately NOT the instance holding auth
    # sessions. The two want opposite things from a server that fills up: a
    # cache should shed its oldest entries, while a session store must never
    # lose a key — a missing session reads as a revoked one and signs the user
    # out of every device — and `maxmemory-policy` is per instance, so no
    # single policy serves both. Hence `allkeys-lru` here, and `whisky-valkey`
    # left alone on its own network.
    #
    # No persistence: every entry is regenerable, and reloading an append-only
    # file on restart would refill memory with entries the boot bump has
    # already superseded.
    #
    # It sits on this project's own network rather than an external one
    # because nothing else uses it, unlike the database and the session store.
    command:
      - valkey-server
      - --maxmemory
      - ${CACHE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    # Nothing outside the compose network needs this one — the application
    # reaches it by container name — so the published port is for a
    # `valkey-cli` from the host and nothing else.
    ports:
      - '${CACHE_BIND_IP:-192.168.179.2}:${CACHE_BIND_PORT:-6377}:6379'
    networks:
      - whisky-be
    healthcheck:
      test: valkey-cli ping
      start_period: 1s
      interval: 10s
      timeout: 2s
      retries: 3
    deploy:
      resources:
        limits:
          # Must stay above `--maxmemory`, so that eviction is what bounds the
          # data and this is only a backstop. Raising one without the other is
          # the way to get the container OOM-killed instead of shedding its
          # oldest entries, which is why both are variables.
          memory: ${CACHE_MEMORY_LIMIT:-640M}
    logging: *logging
    restart: unless-stopped

  be:
    # No `container_name`: compose refuses a fixed name for a service with
    # more than one replica, and this one is scaled by `APP_INSTANCES` below.
    # The replicas are therefore named after the project and this service —
    # `whisky-be-1..N` — which is also the DNS name HAProxy resolves them by,
    # so renaming this service means editing `infra/haproxy/haproxy.cfg` in the same breath.
    image: whisky-be
    build:
      context: .
      dockerfile: Dockerfile
    # The app container may only START after migrations succeed. NB: a bare
    # `up -d --build` still replaces the old container during the create
    # phase, so a failed migration leaves the app stopped (`Created`, never
    # started). Deploy with scripts/deploy.sh (build -> run migrate -> up) to
    # keep the previous version serving when a migration fails.
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Healthy, unlike the cache below: a session lookup runs in the auth
      # guard ahead of everything, and it fails closed.
      valkey:
        condition: service_healthy
      # Started, not healthy: every cache failure degrades to a miss, so the
      # API must never wait on it to begin serving.
      cache:
        condition: service_started
    environment:
      - APP_PORT=${APP_PORT:-4000}
      - APP_HOST=0.0.0.0
      - APP_NAME=${APP_NAME:-}
      - APP_LOGGING=${APP_LOGGING:-}
      - APP_LOGLEVEL=${APP_LOGLEVEL:-}
      - APP_REQUEST_TIMEOUT_MS=${APP_REQUEST_TIMEOUT_MS:-}
      - APP_REQUEST_DEADLINE_MS=${APP_REQUEST_DEADLINE_MS:-}
      - APP_KEEP_ALIVE_TIMEOUT_MS=${APP_KEEP_ALIVE_TIMEOUT_MS:-}
      - APP_TRUST_PROXY=${APP_TRUST_PROXY:-}
      - APP_TRUSTED_IP_HEADERS=${APP_TRUSTED_IP_HEADERS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Addresses of the containers this same file defines, so they are
      # facts of the compose project rather than deployment choices — as are
      # `DB_HOST`/`DB_PORT` and the cache pair below.
      - VALKEY_HOST=whisky-valkey
      - VALKEY_PORT=6379
      - VALKEY_DB=0
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-}
      - VALKEY_PREFIX=${VALKEY_PREFIX:-}
      - VALKEY_COMMAND_TIMEOUT_MS=${VALKEY_COMMAND_TIMEOUT_MS:-}
      - VALKEY_CONNECT_TIMEOUT_MS=${VALKEY_CONNECT_TIMEOUT_MS:-}
      - VALKEY_KEEP_ALIVE_MS=${VALKEY_KEEP_ALIVE_MS:-}
      - VALKEY_MAX_RETRIES_PER_REQUEST=${VALKEY_MAX_RETRIES_PER_REQUEST:-}
      - VALKEY_OFFLINE_QUEUE=${VALKEY_OFFLINE_QUEUE:-}
      - CACHE_ENABLED=${CACHE_ENABLED:-}
      - CACHE_BOOT_BUMP=${CACHE_BOOT_BUMP:-}
      - CACHE_TTL_SEC=${CACHE_TTL_SEC:-}
      - CACHE_READ_TIMEOUT_MS=${CACHE_READ_TIMEOUT_MS:-}
      - CACHE_MAX_ENTRY_BYTES=${CACHE_MAX_ENTRY_BYTES:-}
      - CACHE_MAX_SET_BYTES=${CACHE_MAX_SET_BYTES:-}
      # Fixed, like the session store's address above: the container they
      # name is defined in this same file, so it is a fact of the compose
      # project rather than a deployment choice.
      - CACHE_VALKEY_HOST=whisky-cache
      - CACHE_VALKEY_PORT=6379
      - CACHE_VALKEY_DB=${CACHE_VALKEY_DB:-}
      - CACHE_VALKEY_PASSWORD=${CACHE_VALKEY_PASSWORD:-}
      - CACHE_VALKEY_PREFIX=${CACHE_VALKEY_PREFIX:-}
      - CACHE_VALKEY_COMMAND_TIMEOUT_MS=${CACHE_VALKEY_COMMAND_TIMEOUT_MS:-}
      - CACHE_VALKEY_CONNECT_TIMEOUT_MS=${CACHE_VALKEY_CONNECT_TIMEOUT_MS:-}
      - CACHE_VALKEY_KEEP_ALIVE_MS=${CACHE_VALKEY_KEEP_ALIVE_MS:-}
      - CACHE_VALKEY_MAX_RETRIES_PER_REQUEST=${CACHE_VALKEY_MAX_RETRIES_PER_REQUEST:-}
      - DB_LOGGING=false
      - DB_HOST=whisky-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASS=${DB_PASS:?DB_PASS is required}
      - DB_SLOW_QUERY_MS=2500
      - DB_LOG_PARAMETERS=${DB_LOG_PARAMETERS:-}
      # The pool across every instance, divided by APP_INSTANCES at
      # startup. Sized against the database's max_connections, which is a
      # property of the server rather than of how many instances run.
      - DB_POOL_SIZE_TOTAL=${DB_POOL_SIZE_TOTAL:-}
      - APP_INSTANCES=${APP_INSTANCES:-}
      - DB_RETRY_ATTEMPTS=${DB_RETRY_ATTEMPTS:-}
      - DB_RETRY_DELAY=${DB_RETRY_DELAY:-}
      - DB_ACQUIRE_TIMEOUT_MS=${DB_ACQUIRE_TIMEOUT_MS:-}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-}
      - DB_IDLE_IN_TRANSACTION_TIMEOUT_MS=${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES:-}
      - REFRESH_EXPIRES_SEC=${REFRESH_EXPIRES_SEC:-}
      # Forwarded with `info` as the fallback, not pinned: at `trace` the
      # request interceptor serialises every response body into the log, and
      # the 2026-09-13 load test found the API bound by one event loop that
      # has no room for that. `debug` is the level production has run at.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # JSON since 2026-09-16, which reverses what this block used to pin. The
      # previous answer was `pino-pretty` with `singleLine` and `colorize`, so
      # production wrote ANSI escape codes and no structure — the worst
      # possible input for a log pipeline, which would have had to strip the
      # colour and regex the line back apart, with every field breaking on the
      # next `pino-pretty` release. With this true pino installs no transport
      # at all, and `level`, `time`, `context` and `reqId` arrive as fields
      # Vector ships and LogsQL filters on (docs/LOGS-PLAN.md §5).
      #
      # The cost is that `docker compose logs be` is no longer pleasant to read
      # directly. That is what pino-pretty is for, on demand:
      #
      #   docker compose logs -f be | npx pino-pretty
      #
      # The two lines below are inert while this is true — the transport they
      # configure is never installed — and are deliberately left as they were,
      # so that flipping this one line back restores exactly the previous
      # behaviour rather than a colourless variant of it.
      - LOG_JSON=true
      - LOG_PRETTY=false
      - LOG_CALLSITES=false
      - LOG_COLOR=true
      - LOG_DB=${LOG_DB:-}
      # The four LOG_* lines above are pinned rather than passed through: they
      # are this deployment's settled answers, and the pipeline above now
      # depends on `LOG_JSON` being one of them rather than a host variable
      # somebody can unset. `SWAGGER_ENABLED` is load-bearing for a different
      # reason — `../web` generates its API client by fetching /docs-json at
      # deploy time, so turning it off breaks that build rather than merely
      # hiding a page.
      - SWAGGER_ENABLED=true
      - METRICS_ENABLED=${METRICS_ENABLED:-}
      - METRICS_DEFAULT_METRICS=${METRICS_DEFAULT_METRICS:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - METRICS_COLLECT_INTERVAL_MS=${METRICS_COLLECT_INTERVAL_MS:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-}
      - RATE_LIMIT_HEAVY_RPS=${RATE_LIMIT_HEAVY_RPS:-}
      - RATE_LIMIT_HEAVY_BURST=${RATE_LIMIT_HEAVY_BURST:-}
      - RATE_LIMIT_STRICT_RPS=${RATE_LIMIT_STRICT_RPS:-}
      - RATE_LIMIT_STRICT_BURST=${RATE_LIMIT_STRICT_BURST:-}
      - RATE_LIMIT_AUTH_RPS=${RATE_LIMIT_AUTH_RPS:-}
      - RATE_LIMIT_AUTH_BURST=${RATE_LIMIT_AUTH_BURST:-}
      - RATE_LIMIT_TIMEOUT_MS=${RATE_LIMIT_TIMEOUT_MS:-}
      - SYNC_CRON_ENABLED=${SYNC_CRON_ENABLED:-false}
      - SYNC_CRON_EXPRESSION=${SYNC_CRON_EXPRESSION:-0 12 * * *}
      - SYNC_TIMEZONE=${SYNC_TIMEZONE:-Europe/Kyiv}
      - SYNC_MAX_PARALLEL_TRACKS=${SYNC_MAX_PARALLEL_TRACKS:-}
      - SYNC_STORE_TIMEOUT_MS=${SYNC_STORE_TIMEOUT_MS:-}
      - SYNC_BROWSER_STORE_TIMEOUT_MS=${SYNC_BROWSER_STORE_TIMEOUT_MS:-}
      - SYNC_LLM_DEADLINE_MARGIN_MS=${SYNC_LLM_DEADLINE_MARGIN_MS:-}
      - SYNC_LOG_DIR=${SYNC_LOG_DIR:-/app/log}
      - SYNC_LOG_RETENTION_DAYS=${SYNC_LOG_RETENTION_DAYS:-}
      - SCRAPE_DELAY_MULTIPLIER=${SCRAPE_DELAY_MULTIPLIER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_REASONING=${LLM_REASONING:-}
      - LLM_FLAVOR_MODEL=${LLM_FLAVOR_MODEL:-}
      - LLM_FLAVOR_REASONING=${LLM_FLAVOR_REASONING:-}
      - LLM_RESEARCH_MODEL=${LLM_RESEARCH_MODEL:-}
      - LLM_CONCURRENCY=${LLM_CONCURRENCY:-}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-}
      - LLM_APP_NAME=${LLM_APP_NAME:-Whisky}
      - LLM_APP_URL=${LLM_APP_URL:-}
      - KB_APPLY_ON_BOOT=${KB_APPLY_ON_BOOT:-}
      - PUSH_ENABLED=${PUSH_ENABLED:-false}
      - PUSH_VAPID_PUBLIC_KEY=${PUSH_VAPID_PUBLIC_KEY:-}
      - PUSH_VAPID_PRIVATE_KEY=${PUSH_VAPID_PRIVATE_KEY:-}
      - PUSH_VAPID_SUBJECT=${PUSH_VAPID_SUBJECT:-}
      - PUSH_CONCURRENCY=${PUSH_CONCURRENCY:-}
      - PUSH_TTL_SEC=${PUSH_TTL_SEC:-}
      - PUSH_LOG_RETENTION_DAYS=${PUSH_LOG_RETENTION_DAYS:-}
      - NBU_BASE_URL=${NBU_BASE_URL:-}
      - NBU_TIMEOUT_MS=${NBU_TIMEOUT_MS:-}
      - NBU_RETRIES=${NBU_RETRIES:-}
      - CURRENCY_RATE_CODES=${CURRENCY_RATE_CODES:-}
      - CURRENCY_RATE_CRON_ENABLED=${CURRENCY_RATE_CRON_ENABLED:-}
      - CURRENCY_RATE_CRON_EXPRESSION=${CURRENCY_RATE_CRON_EXPRESSION:-}
      - CURRENCY_RATE_TIMEZONE=${CURRENCY_RATE_TIMEZONE:-}
      - CURRENCY_RATE_SYNC_WINDOW_DAYS=${CURRENCY_RATE_SYNC_WINDOW_DAYS:-}
    # One number drives both halves and they cannot disagree: the replica
    # count here, and the share of `DB_POOL_SIZE_TOTAL` each replica takes
    # (see the environment above). Nothing is published to the host — the
    # `lb` service below is the one door in, on the address the host nginx
    # already proxies to.
    scale: ${APP_INSTANCES:-1}
    volumes:
      # Shared by every replica. Per-run file names carry the timestamp and
      # the store slug, and the `sync_log` lock keeps two instances off one
      # store, so two replicas cannot write the same file.
      - ./log:/app/log
    networks:
      - whisky-be
      - whisky-db
      - whisky-valkey
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 512M
    stop_grace_period: 60s
    logging: *logging
    restart: unless-stopped

  # The one door into the API, publishing exactly the address the host nginx
  # proxies to — so scaling the app touches nothing outside this file.
  #
  # HAProxy rather than Traefik deliberately: Traefik discovers replicas only
  # through the Docker socket, which is root on the host inside the one
  # process that terminates public traffic, and its 2026 record includes two
  # CVSS 10.0 criticals and two authentication bypasses. This one reads
  # Docker's DNS instead and needs no socket, no labels and no privileges.
  # See docs/MULTI-PROCESS-PLAN.md for the comparison.
  lb:
    container_name: whisky-lb
    image: haproxy:3.2-alpine
    depends_on:
      be:
        condition: service_started
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # The same address and port the app used to publish itself on: the host
      # nginx keeps its `proxy_pass` unchanged. The container side is the
      # backend port named in infra/haproxy/haproxy.cfg, which is why `APP_PORT` must stay
      # the default — the app's own listener is internal now.
      - '${APP_BIND_IP:-192.168.179.2}:${APP_BIND_PORT:-9977}:4000'
    networks:
      - whisky-be
    healthcheck:
      test: wget -qO- http://127.0.0.1:8404/metrics > /dev/null || exit 1
      start_period: 5s
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *logging
    restart: unless-stopped

networks:
  whisky-be:
    name: whisky-be
  # Created by this project now that it owns the containers on them. The names
  # are pinned so anything else that attaches by name keeps working.
  whisky-db:
    name: whisky_db
  whisky-valkey:
    name: whisky_valkey

volumes:
  # The production data, declared external on purpose: compose then fails with
  # "volume not found" if the name is wrong, where a project-local volume would
  # be created empty and the migrations would happily seed it. The defaults are
  # the volumes the infrastructure compose project left behind.
  #
  # On a host that has none, create them first:
  #   docker volume create whisky_whisky_pg_data
  #   docker volume create whisky_whisky_valkey_data
  pg_data:
    external: true
    name: ${PG_VOLUME:-whisky_whisky_pg_data}
  valkey_data:
    external: true
    name: ${VALKEY_VOLUME:-whisky_whisky_valkey_data}
