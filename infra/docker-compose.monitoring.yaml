# The monitoring stack, as a compose project of its own.
#
# Separate from `../docker-compose.yaml` deliberately: a broken exporter
# config can never abort `scripts/deploy.sh`, and looking at a dashboard must
# not require redeploying the API. The cost is two commands to operate the
# host and the external network declarations at the bottom.
#
#   docker compose -f infra/docker-compose.monitoring.yaml --env-file infra/.env up -d
#
# Nothing here is reachable from the internet. Grafana publishes on the same
# private address Postgres, both Valkeys and the API already use; everything
# else is on the compose network only.
name: whisky-monitoring

services:
  prometheus:
    container_name: whisky-prom
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Fifteen days at these intervals is a few hundred megabytes, on the
      # same disk as `pg_data` — which is why disk usage is itself alerted.
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-8GB}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      # Bound to the private interface for a person with a browser; Grafana
      # reaches it over the compose network and needs no published port.
      - '${MON_BIND_IP:-192.168.180.1}:${PROM_BIND_PORT:-9090}:9090'
    networks:
      # Its own network, plus the API's — where both the replicas and
      # HAProxy's native exporter live.
      - whisky_monitoring
      - whisky-be
    extra_hosts:
      # node-exporter runs in the host's network namespace, so it is reached
      # through the bridge gateway rather than by container name. Docker maps
      # this name to that address; without it `host.docker.internal` does not
      # resolve on Linux at all.
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/healthy']
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    container_name: whisky-grafana
    image: grafana/grafana:12.1.1
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # No sign-ups and no anonymous access: this is a private interface, not
      # a public one, and the only accounts are the ones an operator creates.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # It is not served under a path by any proxy, so it addresses itself.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://192.168.180.1:3000}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # The VictoriaLogs datasource, and three deliberate choices in one line.
      #
      # NOT `GF_INSTALL_PLUGINS`: deprecated in Grafana 12.1.0, which is
      # exactly the version above, and it carries a known bug where a newer
      # plugin version is not upgraded unless the installed one is removed by
      # hand.
      #
      # The `_SYNC` form and not the plain one, which is a correctness
      # requirement rather than a preference: datasource provisioning runs
      # during startup, so the asynchronous form races it and loses — Grafana
      # finishes provisioning before the plugin exists, the datasource never
      # registers, and every query answers `datasource not found` until
      # somebody restarts the container.
      #
      # Pinned like every image tag here; bump it with the Grafana tag above.
      # The plugin requires Grafana >= 10.4.0 and is signed, so no
      # unsigned-plugin allowance is needed on either install path.
      #
      # A VARIABLE, because the value is where a deployment answers the
      # firewall question: it is fetched from grafana.com at container start,
      # `DOCKER-USER` on this host is a whitelist ending in LOG + DROP, and
      # every dropped packet writes a kernel line `psad` reads as a port scan
      # — the mechanism behind the 2026-08-30..09-05 outages. Worse than a
      # missing panel, because `_SYNC` blocks startup and RETRIES, so a
      # blocked download is a sustained stream of them rather than one packet.
      # Set it EMPTY to take the offline path below; otherwise Grafana reaches
      # for the network even with the plugin already mounted.
      # infra/README.md has the pre-flight check.
      - GF_PLUGINS_PREINSTALL_SYNC=${GRAFANA_PLUGINS_PREINSTALL:-victoriametrics-logs-datasource@0.32.0}
    volumes:
      # Provisioned from files, so no dashboard exists only inside somebody's
      # browser and every change is a diff.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      # No plugin mount, and no GF_PATHS_PLUGINS above: the preinstall writes
      # the plugin into /var/lib/grafana/plugins, which is inside the
      # grafana_data volume and therefore writable and persistent. That is
      # Grafana's own default and it needs no help.
      #
      # THE OFFLINE PATH IS MUTUALLY EXCLUSIVE WITH THE LINE ABOVE, and
      # getting that wrong is how this was first written: a read-only bind at
      # the plugin directory makes the preinstall fail with `mkdir …:
      # read-only file system`, because installing IS a write. So a host that
      # cannot reach grafana.com uncomments this AND sets
      # `GRAFANA_PLUGINS_PREINSTALL=` to the empty string, so that nothing
      # tries to write here. See infra/README.md.
      # - ./grafana/plugins/victoriametrics-logs-datasource:/var/lib/grafana/plugins/victoriametrics-logs-datasource:ro
    depends_on:
      prometheus:
        condition: service_started
      victorialogs:
        condition: service_started
    ports:
      - '${MON_BIND_IP:-192.168.180.1}:${GRAFANA_BIND_PORT:-3000}:3000'
    networks:
      - whisky_monitoring
    restart: unless-stopped

  alertmanager:
    container_name: whisky-alerts
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Which config is mounted is a variable, because the one thing a
      # deployment changes here — the chat id and the active receiver — has to
      # be written into the file itself: Alertmanager expands no environment
      # variables and has no include directive, so `receivers:` cannot be
      # moved out into a file of its own. The default is the tracked,
      # null-routed config; a deployment that delivers somewhere points this
      # at a git-ignored copy (`*.local.yml`, or a path outside the repo), so
      # that editing it never leaves the working tree dirty for `git pull`.
      - ${ALERTMANAGER_CONFIG:-./alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      # The bot token as a file, for the same reason the config is a copy.
      # Git-ignored, and absent until the operator writes it — the tracked
      # config routes to the null receiver, so a missing file is a stack that
      # starts and simply delivers nowhere.
      - ./alertmanager/telegram-token:/etc/alertmanager/telegram-token:ro
      - alertmanager_data:/alertmanager
    ports:
      - '${MON_BIND_IP:-192.168.180.1}:${ALERTMANAGER_BIND_PORT:-9093}:9093'
    networks:
      - whisky_monitoring
    restart: unless-stopped

  # ---------------------------------------------------------------- logs
  #
  # The log half of this stack, added 2026-09-16. VictoriaLogs stores and
  # queries; Vector collects. Why this and not Loki is argued in
  # docs/LOGS-PLAN.md §2 — the short version is that Loki removed Promtail
  # outright in 3.7.3 and its replacement wants ten times the CPU of the
  # alternatives on a host whose eight cores are already oversubscribed, and
  # that Loki's cardinality model is a foot-gun this project does not need.
  victorialogs:
    container_name: whisky-vlogs
    # No `-victorialogs` tag suffix. That was the convention while the code
    # lived in the VictoriaMetrics monorepo; the repository split in July 2025
    # and the tags are plain `v1.52.0` now. Every older tutorial still shows
    # the suffix, and such a tag does not exist.
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - --storageDataPath=/victoria-logs-data
      # Two ceilings, exactly as Prometheus has two, and for the same reason:
      # this data shares a disk with `pg_data`, the session Valkey's AOF, the
      # bind-mounted `./log` and the Prometheus TSDB, and the only guard on
      # that disk is an 85 %-full alert.
      #
      # Thirty days matches SYNC_LOG_RETENTION_DAYS, so the searchable window
      # and the on-disk sync files expire together.
      - --retentionPeriod=${VLOGS_RETENTION:-30d}
      # The second ceiling is by bytes rather than by percent because the two
      # disk flags are MUTUALLY EXCLUSIVE — `-retention.maxDiskUsagePercent`
      # refuses to start alongside this one — and an absolute number is the
      # one that reads the same as PROM_RETENTION_SIZE beside it.
      - --retention.maxDiskSpaceUsageBytes=${VLOGS_RETENTION_SIZE:-8GB}
    volumes:
      - victorialogs_data:/victoria-logs-data
    ports:
      # Published, unlike the exporters, and deliberately: VictoriaLogs ships
      # its own log-explorer UI on this port, which is the whole answer if the
      # Grafana datasource plugin cannot be downloaded on this host (see
      # infra/README.md — grafana.com is a destination the DOCKER-USER
      # whitelist has never been asked about). It is also what the
      # verification queries in docs/LOGS-PLAN.md §8 address.
      - '${MON_BIND_IP:-192.168.180.1}:${VLOGS_BIND_PORT:-10428}:9428'
    networks:
      # Its own network only. Vector, Grafana and Prometheus all reach it
      # here; nothing on the application's networks talks to it.
      - whisky_monitoring
    # No healthcheck, which is the house pattern here — seven of the eight
    # services above have none either. VictoriaLogs documents no health
    # endpoint, and inventing a probe against `/metrics` would be a second,
    # weaker answer to a question Prometheus already answers properly: the
    # `victorialogs` scrape job reads `up`, and that is what alerts.
    deploy:
      resources:
        limits:
          # VictoriaMetrics products read the cgroup limit and size their
          # caches to a share of it, so this is a working budget rather than
          # only a backstop.
          memory: ${VLOGS_MEMORY_LIMIT:-1024M}
    # In-memory rows are flushed on a timer and on SIGTERM. Long enough for
    # that flush to finish rather than being killed at the default ten
    # seconds with rows still unwritten.
    stop_grace_period: 60s
    restart: unless-stopped

  vector:
    container_name: whisky-vector
    image: timberio/vector:0.58.0-debian
    # Debian rather than alpine or distroless: this container reads
    # bind-mounted host files, and a shell is worth having the first time a
    # permission question comes up.
    #
    # Vector rather than the lighter `vlagent` (28 MiB) or Fluent Bit
    # (78 MiB), which on this host is a real argument and is overruled by one
    # source: the per-sync scrape logs carry their date only in the FILENAME,
    # so the collector has to lift a field out of the file path and combine it
    # with a clock-only timestamp. VRL does that in a few readable lines;
    # vlagent does no custom format parsing at all. See docs/LOGS-PLAN.md §4.3
    # — if those files ever leave scope, vlagent becomes the obvious swap.
    command:
      - --config
      - /etc/vector/vector.yaml
    # Root, for two reasons that are both about reading rather than writing:
    # the Docker socket, and nginx's log files, which are root-owned 0640.
    # Vector's own documentation says the process must be able to run `docker`.
    user: root
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      # The same socket cAdvisor already has, and justified the same way:
      # terminates no public traffic, publishes nothing — the distinction from
      # the Traefik case this socket was refused for.
      #
      # Said honestly, because the flag invites the wrong conclusion: `:ro`
      # makes the SOCKET FILE unwritable and does NOT make the Docker API
      # read-only. Whatever holds this socket is root on the host. What bounds
      # the exposure is the rest of this service — read-only mounts, no
      # published port, one network, nothing on the request path — and not
      # this flag.
      #
      # NB: VictoriaMetrics' own reference compose also mounts
      # /var/lib/docker, and that is NOT needed. Vector's `docker_logs` source
      # streams from the Docker API over this socket; the data root buys
      # nothing and is a needless second exposure.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The application's per-run scrape logs. Read-only rather than
      # read-write: Vector must never be able to disturb the files the
      # 30-day retention sweep and `GET /store/:slug/sync-log/:id/file`
      # depend on. Relative to this file, so `infra/../log`.
      - ../log:/app/log:ro
      # The nginx access and error logs. nginx here is a container
      # (`nginx-proxy`) that writes files rather than stdout, so this is the
      # host path it bind-mounts — confirm it with
      # `docker inspect nginx-proxy --format '{{json .Mounts}}'` before the
      # first deploy, which is why it is a variable and not a literal.
      - ${NGINX_LOG_DIR:-/var/log/nginx}:/var/log/nginx:ro
      # Vector's read checkpoints. A named volume rather than nothing: on a
      # container recreate an empty checkpoint directory makes Vector re-read
      # every file inside its `ignore_older_secs` window and ship it twice.
      - vector_data:/var/lib/vector
    depends_on:
      victorialogs:
        condition: service_started
    networks:
      - whisky_monitoring
    deploy:
      resources:
        limits:
          memory: ${VECTOR_MEMORY_LIMIT:-384M}
          # A CPU ceiling, which nothing else in this file has, and the reason
          # it is here rather than everywhere: the 2026-09-13 ladders named
          # eight cores shared by three Node replicas, Postgres, two Valkeys
          # and HAProxy as the constraint, and the one thing Vector does that
          # can peg a core is exactly what happens on a first start — reading
          # a large file and gzipping it.
          cpus: '${VECTOR_CPU_LIMIT:-0.75}'
    # Vector flushes its sinks on SIGTERM. Long enough for a batch in flight
    # to drain rather than being killed with events still buffered.
    stop_grace_period: 30s
    restart: unless-stopped

  node-exporter:
    container_name: whisky-node-exporter
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Only the host's real filesystems: without this every container's
      # overlay mount appears as its own device and the disk panels become
      # unreadable.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/credentials)($$|/)
      # Every interface, deliberately: it runs in the host's network
      # namespace and is scraped through the bridge gateway, which binding to
      # one private address would exclude. What keeps port 9100 off the
      # internet is the host firewall — the same `DOCKER-USER` whitelist that
      # already guards Postgres and both Valkeys — rather than this line.
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    # The host's own network namespace, so its interfaces are the ones
    # measured rather than the container's.
    network_mode: host
    pid: host
    restart: unless-stopped

  cadvisor:
    container_name: whisky-cadvisor
    # `ghcr.io/google/cadvisor`, not the `gcr.io/cadvisor/cadvisor` every older
    # example still shows: publishing moved to GHCR at exactly v0.53.0, so
    # gcr.io stops at v0.55.1 and answers `not found` for anything from that
    # release on — including the version this file first pinned.
    image: ghcr.io/google/cadvisor:v0.60.5
    # It answers the question this host actually has: which of the eight
    # processes sharing eight cores spent them. The Docker socket is how it
    # resolves container names — without it the panels are labelled by cgroup
    # id and become useless on the next redeploy.
    #
    # It is read-only, it terminates no public traffic and it publishes
    # nothing, which is what separates it from the Traefik case that socket
    # was refused for (see docs/MULTI-PROCESS-PLAN.md).
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # Per-process and per-thread series are the bulk of cAdvisor's
      # cardinality and answer nothing here.
      - --disable_metrics=percpu,process,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    devices:
      - /dev/kmsg
    networks:
      - whisky_monitoring
    restart: unless-stopped

  postgres-exporter:
    container_name: whisky-exporter-pg
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    command:
      - --collector.stat_statements
    environment:
      # The application's own role. It owns the database and may therefore
      # read `pg_stat_statements`, which is the point — that extension was
      # installed because nothing could say where the database's time went,
      # and unscraped it answers only whoever is logged in at the time.
      - DATA_SOURCE_NAME=postgresql://${DB_USER:?DB_USER is required}:${DB_PASS:?DB_PASS is required}@whisky-db:5432/${DB_NAME:?DB_NAME is required}?sslmode=disable
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres-exporter/queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    networks:
      - whisky_monitoring
      - whisky-db
    restart: unless-stopped

  redis-exporter-session:
    container_name: whisky-exporter-session
    image: oliver006/redis_exporter:v1.78.0
    # Valkey speaks the Redis protocol, so this exporter reads it unchanged.
    # This is the instance that must NEVER evict: a lost session key reads as
    # a revoked session and signs that user out of every device, which is why
    # `redis_evicted_keys_total` here is an alert rather than a statistic.
    command:
      - --redis.addr=redis://whisky-valkey:6379
    environment:
      - REDIS_PASSWORD=${VALKEY_PASSWORD:-}
    networks:
      - whisky_monitoring
      - whisky-valkey
    restart: unless-stopped

  redis-exporter-cache:
    container_name: whisky-exporter-cache
    image: oliver006/redis_exporter:v1.78.0
    # The opposite instance: eviction here is normal and expected, and the
    # eviction count is the number that said 3 GiB was needed — a ladder once
    # peaked at 1.16 GiB and evicted 4 038 live entries, each of which is a
    # database query later.
    command:
      - --redis.addr=redis://whisky-cache:6379
    environment:
      - REDIS_PASSWORD=${CACHE_VALKEY_PASSWORD:-}
    networks:
      - whisky_monitoring
      # The cache sits on the API's network, not on a Valkey one of its own.
      - whisky-be
    restart: unless-stopped

networks:
  # This project's own.
  whisky_monitoring:
    name: whisky_monitoring

  # Created by `../docker-compose.yaml`. Declared external so this project
  # attaches to them and never creates an empty copy under its own name —
  # which is how an exporter ends up on a network where its target does not
  # exist and reports everything down.
  whisky-be:
    external: true
    name: whisky-be

  whisky-db:
    external: true
    name: whisky_db

  whisky-valkey:
    external: true
    name: whisky_valkey

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  victorialogs_data:
  vector_data:
